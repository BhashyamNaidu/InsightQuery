<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Inter;src:url("../../src/assets/fonts/inter-latin.woff2");font-weight:100 900}
@font-face{font-family:"JetBrains Mono";src:url("../../src/assets/fonts/jetbrains-mono-latin.woff2");font-weight:100 800}
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#060a13;color:#e8edf7;font-family:Inter,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;inset:0;background:radial-gradient(55% 70% at 85% 0%,rgba(91,140,255,.32),transparent 70%),radial-gradient(40% 50% at 0% 100%,rgba(34,211,238,.14),transparent 70%)}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(148,163,184,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.14) 1px,transparent 1px);background-size:60px 60px;-webkit-mask-image:radial-gradient(80% 90% at 70% 0%,#000,transparent 75%);opacity:.5}
.wrap{position:relative;padding:64px 72px;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px;font-weight:700;font-size:34px;letter-spacing:-.03em}
.brand span{color:#6b97ff}
h1{font-size:76px;line-height:1.02;font-weight:800;letter-spacing:-.045em;max-width:980px}
h1 em{font-style:normal;background:linear-gradient(95deg,#6b97ff,#22d3ee);-webkit-background-clip:text;color:transparent}
.sub{margin-top:22px;font-size:27px;color:#a9b5cc;max-width:900px;line-height:1.4}
.stats{display:flex;gap:0;border:1px solid rgba(148,163,184,.28);border-radius:16px;background:rgba(13,21,38,.85);overflow:hidden;width:max-content}
.stats div{padding:16px 28px;border-right:1px solid rgba(148,163,184,.2)}
.stats div:last-child{border:0}
.stats b{display:block;font-size:30px;letter-spacing:-.03em}
.stats small{font-family:"JetBrains Mono";font-size:13px;color:#8391ab;text-transform:uppercase;letter-spacing:.07em}
</style></head><body>
<div class="glow"></div><div class="grid"></div>
<div class="wrap">
  <div class="brand">
    <svg width="48" height="48" viewBox="0 0 32 32"><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#22d3ee"/></linearGradient></defs>
    <circle cx="14" cy="14" r="8.5" fill="none" stroke="url(#bm)" stroke-width="3"/><path d="M20.5 20.5 27 27" stroke="url(#bm)" stroke-width="3.2" stroke-linecap="round"/><path d="M10.2 14.2l2.7 2.7 5-5.4" fill="none" stroke="#e8edf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>Insight<span>Query</span></div>
  </div>
  <div>
    <h1>From a plain-English question to <em>evidence you can audit.</em></h1>
    <p class="sub">Constrained SQL analytics + evaluated RAG + LLM synthesis, behind a validator, least-privilege grants and an audit log.</p>
  </div>
  <div class="stats">
    <div><b>263,841</b><small>records</small></div>
    <div><b>164</b><small>tests passing</small></div>
    <div><b>7 / 7</b><small>malicious SQL blocked</small></div>
    <div><b>1.00</b><small>RAG recall@5 (n=15)</small></div>
  </div>
</div>
</body></html>
