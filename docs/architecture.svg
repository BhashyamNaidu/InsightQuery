<svg viewBox="0 0 980 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect width="980" height="720" fill="#ffffff"/>

  <!-- User question -->
  <rect x="370" y="20" width="240" height="50" rx="8" fill="#eef2ff" stroke="#4338ca" stroke-width="1.5"/>
  <text x="490" y="50" text-anchor="middle" font-size="16" fill="#1e1b4b">User Question</text>

  <line x1="490" y1="70" x2="490" y2="105" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Intent classifier -->
  <rect x="330" y="105" width="320" height="55" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="490" y="128" text-anchor="middle" font-size="15" fill="#78350f">Intent Classification (LLM)</text>
  <text x="490" y="147" text-anchor="middle" font-size="12" fill="#92400e">constrained JSON: sql | rag | hybrid</text>

  <line x1="490" y1="160" x2="490" y2="190" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Route split -->
  <polygon points="490,188 560,220 490,252 420,220" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="490" y="224" text-anchor="middle" font-size="13" fill="#111827">Route</text>

  <line x1="440" y1="235" x2="230" y2="280" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="540" y1="235" x2="750" y2="280" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- SQL branch -->
  <rect x="60" y="280" width="340" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="230" y="304" text-anchor="middle" font-size="15" fill="#1e3a8a">NL-to-SQL Generation (LLM)</text>
  <text x="230" y="324" text-anchor="middle" font-size="12" fill="#1e40af">proposes a SELECT statement</text>

  <line x1="230" y1="340" x2="230" y2="370" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="30" y="370" width="400" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="230" y="394" text-anchor="middle" font-size="15" fill="#7f1d1d">AST Validator + Read-Only Role</text>
  <text x="230" y="413" text-anchor="middle" font-size="12" fill="#991b1b">reject unless: SELECT-only, allow-listed</text>
  <text x="230" y="428" text-anchor="middle" font-size="12" fill="#991b1b">tables/columns, row limit, no side effects</text>

  <line x1="230" y1="440" x2="230" y2="470" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="470" width="340" height="55" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="230" y="493" text-anchor="middle" font-size="15" fill="#14532d">Validated SQL Result</text>
  <text x="230" y="512" text-anchor="middle" font-size="12" fill="#166534">Postgres — source of truth</text>

  <!-- RAG branch -->
  <rect x="600" y="280" width="340" height="60" rx="8" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="770" y="304" text-anchor="middle" font-size="15" fill="#1e3a8a">Question Embedding</text>
  <text x="770" y="324" text-anchor="middle" font-size="12" fill="#1e40af">sentence-transformers, local, no API cost</text>

  <line x1="770" y1="340" x2="770" y2="370" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="600" y="370" width="340" height="60" rx="8" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="770" y="394" text-anchor="middle" font-size="15" fill="#4c1d95">pgvector Cosine Search</text>
  <text x="770" y="413" text-anchor="middle" font-size="12" fill="#5b21b6">top-k chunks + source metadata</text>

  <line x1="770" y1="430" x2="770" y2="470" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="600" y="470" width="340" height="55" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="1.5"/>
  <text x="770" y="493" text-anchor="middle" font-size="15" fill="#14532d">Retrieved Evidence Chunks</text>
  <text x="770" y="512" text-anchor="middle" font-size="12" fill="#166534">cited by document title</text>

  <!-- Merge -->
  <line x1="230" y1="525" x2="490" y2="570" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="770" y1="525" x2="490" y2="570" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="310" y="570" width="360" height="55" rx="8" fill="#f3f4f6" stroke="#374151" stroke-width="1.5"/>
  <text x="490" y="593" text-anchor="middle" font-size="15" fill="#111827">Evidence Context</text>
  <text x="490" y="612" text-anchor="middle" font-size="12" fill="#374151">SQL rows + cited chunks, nothing else</text>

  <line x1="490" y1="625" x2="490" y2="650" stroke="#4b5563" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="290" y="650" width="400" height="55" rx="8" fill="#fce7f3" stroke="#be185d" stroke-width="1.5"/>
  <text x="490" y="673" text-anchor="middle" font-size="15" fill="#831843">LLM Synthesis (evidence-only prompt)</text>
  <text x="490" y="692" text-anchor="middle" font-size="12" fill="#9d174d">answer + citations + confidence + limitations</text>
</svg>
