services:
  db:
    image: pgvector/pgvector:pg16
    container_name: insightquery-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: insightquery
      POSTGRES_USER: insightquery
      POSTGRES_PASSWORD: insightquery
    ports:
      # Host port 5433, not 5432: this machine already runs a native PostgreSQL
      # service on 5432 (unrelated to this project) — mapping to 5432 here caused
      # host connections to silently resolve to the native service instead of this
      # container (both ended up listening on 5432; the native one won), producing
      # a confusing "password authentication failed" for a role that only exists in
      # the container. 5433 avoids the ambiguity entirely. Container-to-container
      # traffic (the api service below) is unaffected — it uses the container's
      # internal 5432 regardless of this host mapping.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_db_roles.sql:/docker-entrypoint-initdb.d/10_init_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightquery -d insightquery"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: insightquery-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://insightquery:insightquery@db:5432/insightquery
      READONLY_DATABASE_URL: postgresql+psycopg://insightquery_readonly:insightquery_readonly@db:5432/insightquery
      # Ollama (the default LLM_PROVIDER) runs on the host, not in a container — see
      # docs/LLM_STRATEGY.md for why. `localhost` inside this container refers to the
      # container itself, so it needs Docker Desktop's host-machine DNS name instead.
      # Only takes effect if .env doesn't already set OLLAMA_BASE_URL (env_file above
      # is overridden by this block's values for any key present in both).
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      # The Dockerfile never COPYs docs/ into the image (only requirements.txt and
      # app/ — see docker/Dockerfile), so without this mount GET /evaluations has
      # no way to read scripts/evaluate.py's output and the Metrics page would
      # show "not yet run" even right after running it. Read-write, not :ro,
      # because scripts run from inside the container (or against this same
      # database from the host) write these files.
      - ./docs:/app/docs

volumes:
  pgdata:
