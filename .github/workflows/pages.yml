name: Deploy showcase site

# Builds the static recruiter-facing site (site/) and publishes it to GitHub Pages.
# The site needs no secrets: it is static HTML/CSS/JS plus data derived from files already in the repo.
on:
  push:
    branches: [master]
    paths:
      - "site/**"
      - "docs/*_eval_results.json"
      - "docs/evaluation_results.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build
        run: node site/build.mjs
      - name: Verify (links, anchors, repo paths, metadata, secrets scan)
        run: node site/check.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
