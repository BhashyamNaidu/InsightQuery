<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}InsightQuery{% endblock %}</title>
<link rel="stylesheet" href="/static/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="topbar">
    <div class="brand">INSIGHTQUERY<span class="brand-sub">AI-Powered Investigation &amp; Analytics</span></div>
    <nav class="nav">
      <a href="/" class="{% if active == 'investigate' %}active{% endif %}">Investigate</a>
      <a href="/history" class="{% if active == 'history' %}active{% endif %}">History</a>
      <a href="/metrics" class="{% if active == 'metrics' %}active{% endif %}">Metrics</a>
      <a href="/docs" target="_blank">API Docs</a>
    </nav>
  </div>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
